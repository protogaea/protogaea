[package]
name = "protogaea-server"
description = "The Protogaea world server: runs the authoritative world, keeps the event log and serves the read API"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
axum = "0.8.9"
getrandom = "0.3"
protogaea-core.workspace = true
protogaea-pow = { path = "../pow", features = ["c"] }
protogaea-protocol = { path = "../protocol" }
protogaea-stories.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "cors"] }
