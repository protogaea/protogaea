[package]
name = "protogaea-pow"
description = "The proof of work of Protogaea sparks: yespower 1.0 with the spark personalization, the spark input and the target check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The reference C implementation next to the Rust port, to check and compare them; needs a C compiler.
c = ["dep:cc"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
cc = { version = "1", optional = true }
