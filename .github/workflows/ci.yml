name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Spec §14: the same seeds must give the same state hashes on every platform.
  determinism:
    name: Hashes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: State hashes
        shell: bash
        run: cargo run --release -p protogaea-harness -- hash --seeds 1,2 --epochs 500 --every 100 > hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes.txt

  wasm:
    name: Hashes (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Core builds for the browser
        run: cargo build --release -p protogaea-core --target wasm32-unknown-unknown
      - name: Harness builds for WASI
        run: cargo build --release -p protogaea-harness --target wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: State hashes
        run: wasmtime run target/wasm32-wasip1/release/protogaea-harness.wasm hash --seeds 1,2 --epochs 500 --every 100 > hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-wasm
          path: hashes.txt

  compare:
    name: Compare hashes across platforms
    needs: [determinism, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: All platforms agree
        run: |
          reference=$(ls -d hashes/*/ | head -1)
          echo "reference: $reference"
          cat "$reference/hashes.txt"
          status=0
          for dir in hashes/*/; do
            if ! diff -u "$reference/hashes.txt" "$dir/hashes.txt"; then
              echo "::error::$dir differs from $reference"
              status=1
            fi
          done
          exit $status
