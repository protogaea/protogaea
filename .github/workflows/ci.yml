name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FAST_SEASON: >-
    .rifts.fault_day = 0 | .rifts.shallows_from_day = 0 | .rifts.deep_from_day = 1 |
    .rifts.bridges_from_day = 1 | .rifts.bridges_to_day = 2

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The Rust port of yespower against the reference C implementation.
      - run: cargo clippy -p protogaea-pow --all-targets --features c -- -D warnings
      - run: cargo test -p protogaea-pow --features c

  viewer:
    name: Viewer builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build

  # Spec §14: the same seeds must give the same state hashes on every platform.
  determinism:
    name: Hashes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The second run compresses Season 1 into two world days, so that faults, flooding,
      # sinking cells, rescues and closing land bridges are compared too.
      - name: State hashes
        shell: bash
        run: |
          cargo run --release -p protogaea-harness -- hash --seeds 1,2 --epochs 500 --every 100 > hashes.txt
          cargo run --release -p protogaea-harness -- ruleset | jq "$FAST_SEASON" > fast-season.json
          cargo run --release -p protogaea-harness -- hash --seeds 3 --epochs 600 --every 100 --ruleset fast-season.json >> hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes.txt

  wasm:
    name: Hashes (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Core builds for the browser
        run: cargo build --release -p protogaea-core --target wasm32-unknown-unknown
      - name: Harness builds for WASI
        run: cargo build --release -p protogaea-harness --target wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: State hashes
        run: |
          wasmtime run target/wasm32-wasip1/release/protogaea-harness.wasm hash --seeds 1,2 --epochs 500 --every 100 > hashes.txt
          wasmtime run target/wasm32-wasip1/release/protogaea-harness.wasm ruleset | jq "$FAST_SEASON" > fast-season.json
          wasmtime run --dir . target/wasm32-wasip1/release/protogaea-harness.wasm hash --seeds 3 --epochs 600 --every 100 --ruleset fast-season.json >> hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-wasm
          path: hashes.txt

  compare:
    name: Compare hashes across platforms
    needs: [determinism, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: All platforms agree
        run: |
          reference=$(ls -d hashes/*/ | head -1)
          echo "reference: $reference"
          cat "$reference/hashes.txt"
          status=0
          for dir in hashes/*/; do
            if ! diff -u "$reference/hashes.txt" "$dir/hashes.txt"; then
              echo "::error::$dir differs from $reference"
              status=1
            fi
          done
          exit $status
